{% extends "base.html" %}
{% block title %}Metadata Governance Dashboard{% endblock %}

{% block content %}

<div id="loading" class="loading hidden">
    Loading dashboard...
</div>

<div class="dashboard-header">

    <div>
        <h2 class="dashboard-title">
            Metadata Governance Dashboard
        </h2>
    </div>

    <div class="dashboard-meta">

        <div class="toolbar">

            <div class="toolbar-group">
                <label for="scope">Scope</label>
                <select id="scope">
                    <option value="organization">Organization</option>
                    <option value="project">Project</option>
                </select>
            </div>

            <!-- Integrated Project Selector & Brownfield Button -->
            <div class="toolbar-group">
                <label for="project">Project</label>
                <select id="project">
                    <option value="">All Projects</option>
                    <option value="payments-dev-1">payments-dev-1</option>
                </select>
            </div>

            <div class="toolbar-group">
                <button id="run-brownfield-btn" class="btn btn-primary" onclick="triggerBrownfield()" style="margin-top: 18px;">
                    ▶ Run Brownfield
                </button>
            </div>

            <button id="refresh">
                Refresh
            </button>

        </div>

        <div class="dashboard-status">
            <span id="refresh-timer"></span>
            <span id="last-updated">Last Updated -</span>
        </div>

    </div>

</div>

<!-- ===================================================== -->
<!-- Executive Summary -->
<!-- ===================================================== -->
<section class="summary-section">
    <div id="summary-cards" class="summary-grid"></div>
</section>

<!-- ===================================================== -->
<!-- Brownfield / Greenfield -->
<!-- ===================================================== -->
<section class="remediation-grid">
    <div id="brownfield-card" class="summary-panel"></div>
    <div id="greenfield-card" class="summary-panel"></div>
</section>

<!-- ===================================================== -->
<!-- Projects / Resource Types -->
<!-- ===================================================== -->
<section class="content-grid">
    <div class="panel">
        <div class="panel-header">
            <div class="panel-title">Projects</div>
        </div>
        <div id="projects-container" class="panel-body"></div>
    </div>

    <div class="panel">
        <div class="panel-header">
            <div class="panel-title">Resource Types</div>
        </div>
        <div id="resource-types-container" class="panel-body"></div>
    </div>
</section>

<!-- ===================================================== -->
<!-- Recent Activity -->
<!-- ===================================================== -->
<section class="panel">
    <div class="panel-header">
        <div class="panel-title">Recent Activity</div>
    </div>
    <div id="recent-runs-container" class="panel-body"></div>
</section>

<!-- ===================================================== -->
<!-- Non-Compliant -->
<!-- ===================================================== -->
<section id="non-compliant-panel" class="panel">
    <div class="panel-header">
        <div class="panel-title">Top Non-Compliant Resources</div>
    </div>
    <div id="non-compliant-container" class="panel-body"></div>
</section>

<footer class="dashboard-footer">
    Enterprise Metadata Governance Platform
</footer>

<!-- JavaScript for Project Initialization & Brownfield Trigger -->
<script>

async function triggerBrownfield() {
    const projectSelect = document.getElementById('project');
    const projectId = projectSelect ? projectSelect.value : 'payments-dev-1';
    
    if (!projectId) {
        alert("Please select a project first.");
        return;
    }
    
    const btn = document.getElementById('run-brownfield-btn');
    const originalText = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Queuing...';

    try {
        const response = await fetch(`/brownfield?project=${projectId}`, {
            method: 'GET'
        });
        
        if (response.ok) {
            alert(`✅ Brownfield scan initiated for ${projectId}!`);
            setTimeout(() => window.location.reload(), 1500); 
        } else {
            alert(`❌ Failed to start scan. HTTP Status: ${response.status}`);
        }
    } catch (e) {
        alert("Error triggering brownfield scan. Check network logs.");
        console.error(e);
    } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
    }
}
</script>

{% endblock %}
