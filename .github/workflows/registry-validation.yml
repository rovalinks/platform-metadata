name: Registry Validation

on:
  push:
    branches:
      - main
    paths:
      - "registry/**"
      - "validation/**"

  pull_request:
    branches:
      - main
    paths:
      - "registry/**"
      - "validation/**"

jobs:

  validate-registry:

    runs-on: ubuntu-latest

    permissions:
      contents: read
    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies blazingly fast with uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "validation/requirements.txt"
          
      - name: Install Requirements
        run: uv pip install -r validation/requirements.txt --system