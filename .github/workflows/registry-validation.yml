name: Registry Validation

on:
  push:
    branches:
      - main
    paths:
      - "registry/**"
      - "validation/**"

  pull_request:
    branches:
      - main
    paths:
      - "registry/**"
      - "validation/**"

jobs:
  validate-registry:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies blazingly fast with uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "validation/requirements.txt"
          
      - name: Install Requirements
        run: uv pip install -r validation/requirements.txt --system

      # --- NEW STEP: Validate YAML Syntax ---
      - name: Validate YAML Syntax
        run: |
          uv pip install yamllint --system
          # This checks all .yml and .yaml files in the registry folder for syntax errors
          yamllint -d "{extends: relaxed, rules: {line-length: disable, document-start: disable}}" registry/

      # --- NEW STEP: Run your custom schema validation ---
      - name: Run Schema Validation
        run: |
          # Replace this with the actual name of your python script
          python validation/validate_registry.py