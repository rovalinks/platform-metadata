name: Registry Sync

on:
  push:
    branches:
      - main
    paths:
      - "registry/**"
      - ".github/workflows/registry-sync.yml"
  release:
    types: [published] # Triggers the PROD sync

permissions:
  contents: read
  id-token: write

jobs:
  # ==========================================
  # JOB 1: SYNC TO DEV
  # ==========================================
  sync-dev:
    name: Sync Registry to Dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev # CRITICAL: Pulls DEV variables and WIF secrets

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Synchronise Registry
        run: |
          echo "Synchronising registry to DEV bucket: ${{ vars.REGISTRY_BUCKET }}..."
          gcloud storage rsync \
            registry/applications \
            gs://${{ vars.REGISTRY_BUCKET }}/applications \
            --recursive \
            --delete-unmatched-destination-objects

  # ==========================================
  # JOB 2: SYNC TO PROD
  # ==========================================
  sync-prod:
    name: Sync Registry to Prod
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    environment: prod # CRITICAL: Pulls PROD variables and WIF secrets

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Synchronise Registry
        run: |
          echo "Synchronising registry to PROD bucket: ${{ vars.REGISTRY_BUCKET }}..."
          gcloud storage rsync \
            registry/applications \
            gs://${{ vars.REGISTRY_BUCKET }}/applications \
            --recursive \
            --delete-unmatched-destination-objects
