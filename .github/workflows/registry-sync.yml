name: Registry Sync

on:
  push:
    branches:
      - main
    paths:
      - "registry/**"
      - ".github/workflows/registry-sync.yml"

permissions:
  contents: read
  id-token: write

jobs:
  # ==========================================
  # JOINT JOB: PARALLEL SYNC TO DEV AND PROD
  # ==========================================
  sync-environments:
    name: Parallel Registry Sync
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target_env: [dev, prod] # Tells GitHub to execute both tracks at once

    environment: ${{ matrix.target_env }} # Dynamically grabs variables based on track

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          skip_install: true

      - name: Synchronise Registry Bucket
        run: |
          echo "Synchronising registry to ${{ upper(matrix.target_env) }} bucket: ${{ vars.REGISTRY_BUCKET }}..."
          gcloud storage rsync \
            registry/applications \
            gs://${{ vars.REGISTRY_BUCKET }}/applications \
            --recursive \
            --delete-unmatched-destination-objects \
            --cache-control="no-cache"
