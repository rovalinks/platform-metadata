name: Registry Sync

on:
  workflow_dispatch: # Allows you to manually trigger the sync from the GitHub UI
  push:
    branches:
      - main
    paths:
      - "registry/**"
      - ".github/workflows/registry-sync.yml"

permissions:
  contents: read
  id-token: write

jobs:
  # ==========================================
  # PARALLEL MATRIX SYNC TO BOTH ENVIRONMENTS
  # ==========================================
  sync-registry:
    name: Sync Registry to ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, prod] # Runs both jobs side-by-side in parallel

    # Dynamically loads the specific GitHub Environment (Secrets/Variables)
    environment: ${{ matrix.environment }} 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          skip_install: true

      - name: Synchronise Registry Bucket
        run: |
          ENV_NAME=$(echo "${{ matrix.environment }}" | tr '[:lower:]' '[:upper:]')
          echo "Synchronising registry assets to ${ENV_NAME} bucket: ${{ vars.REGISTRY_BUCKET }}..."
          
          mkdir -p registry/${{ matrix.environment }}/applications
          
          gcloud storage rsync \
            registry/${{ matrix.environment }}/applications \
            gs://${{ vars.REGISTRY_BUCKET }}/applications \
            --recursive \
            --delete-unmatched-destination-objects