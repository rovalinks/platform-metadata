name: Deploy Metadata Governance

on:
  push:
    branches:
      - hybrid_governance
    paths:
      - "cloudrun/**"
      - "Dockerfile"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.0
        with:
          fetch-depth: 1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker ${{ vars.REGION }}-docker.pkg.dev --quiet

      - name: Build Image
        run: |
          docker build \
            -f Dockerfile \
            -t "${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/${{ vars.IMAGE_NAME }}:${{ github.sha }}" \
            -t "${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/${{ vars.IMAGE_NAME }}:latest" \
            .

      - name: Push Image
        run: |
          docker push "${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/${{ vars.IMAGE_NAME }}:${{ github.sha }}"
          docker push "${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/${{ vars.IMAGE_NAME }}:latest"

      - name: Get Cloud Run URL
        id: service_url
        run: |
          # 2>/dev/null || echo "" handles the very first deployment gracefully if the service doesn't exist yet
          URL=$(gcloud run services describe ${{ vars.CLOUD_RUN_SERVICE }} \
            --project=${{ vars.PROJECT_ID }} \
            --region=${{ vars.REGION }} \
            --format="value(status.url)" 2>/dev/null || echo "")
          echo "SERVICE_URL=$URL" >> $GITHUB_ENV

      - name: Deploy Cloud Run
        env:
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          REGION: ${{ vars.REGION }}
          TAG_PARENT: ${{ vars.TAG_PARENT }}
          REGISTRY_BUCKET: ${{ vars.REGISTRY_BUCKET }}
          BIGQUERY_DATASET: ${{ vars.BIGQUERY_DATASET }}
          TASK_QUEUE: ${{ vars.TASK_QUEUE }}
          SERVICE_ACCOUNT_EMAIL: ${{ secrets.SERVICE_ACCOUNT_EMAIL }}
          PUBSUB_TOPIC: ${{ vars.PUBSUB_TOPIC }}
          PUBSUB_SUBSCRIPTION: ${{ vars.PUBSUB_SUBSCRIPTION }}
          EVENTARC_TRIGGER: ${{ vars.EVENTARC_TRIGGER }}
          LOGGING_SINK: ${{ vars.LOGGING_SINK }}
          CLOUD_RUN_URL: ${{ env.SERVICE_URL }}
        run: |
          # Safely append pipeline variables to env.yaml using Python via process environment
          # Using single quotes for python execution prevents shell parsing, escaping, and YAML indentation issues.
          python3 -c '
          import os
          content = ""
          if os.path.exists("cloudrun/env.yaml"):
              with open("cloudrun/env.yaml", "r") as f:
                  content = f.read().rstrip() + "\n"

          vars_to_append = [
              "PROJECT_ID", "REGION", "TAG_PARENT", "REGISTRY_BUCKET",
              "BIGQUERY_DATASET", "TASK_QUEUE", "SERVICE_ACCOUNT_EMAIL",
              "PUBSUB_TOPIC", "PUBSUB_SUBSCRIPTION", "EVENTARC_TRIGGER",
              "LOGGING_SINK", "CLOUD_RUN_URL"
          ]

          for key in vars_to_append:
              val = os.environ.get(key, "")
              content += f"{key}: \"{val}\"\n"

          # Ensure the cloudrun directory exists just in case
          os.makedirs("cloudrun", exist_ok=True)
          with open("cloudrun/env.yaml", "w") as f:
              f.write(content)
          '

          # Deploy using only the env-vars-file
          gcloud run deploy ${{ vars.CLOUD_RUN_SERVICE }} \
            --project=${{ vars.PROJECT_ID }} \
            --region=${{ vars.REGION }} \
            --image="${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/${{ vars.IMAGE_NAME }}:latest" \
            --service-account=${{ secrets.SERVICE_ACCOUNT_EMAIL }} \
            --env-vars-file=cloudrun/env.yaml \
            --memory=1Gi \
            --cpu=2 \
            --timeout=900 \
            --concurrency=80 \
            --allow-unauthenticated