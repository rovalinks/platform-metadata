name: Deploy Metadata Governance

on:
  push:
    branches:
      - main
    paths:
      - "cloudrun/**"
      - "Dockerfile"
      - ".github/workflows/deploy.yml"
  release:
    types: [published]

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ==========================================
  # JOB 1: SECURITY CHECKS
  # ==========================================
  security-checks:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: pip install bandit
          
      - name: Run Python Security Scan (Bandit)
        run: bandit -r cloudrun/ -ll -ii

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0' 
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ==========================================
  # JOB 2: DEPLOY TO DEV
  # ==========================================
  deploy-dev:
    name: Build & Deploy (DEV)
    needs: security-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          skip_install: true

      - name: Docker Auth
        run: gcloud auth configure-docker ${{ vars.REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/governance-engine:${{ github.sha }}
            ${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/governance-engine:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # FIX: Natively inject variables into Cloud Run!
      - name: Deploy Cloud Run
        run: |
          gcloud run deploy ${{ vars.CLOUD_RUN_SERVICE }} \
            --project=${{ vars.PROJECT_ID }} \
            --region=${{ vars.REGION }} \
            --image="${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/governance-engine:${{ github.sha }}" \
            --service-account=${{ secrets.WIF_SERVICE_ACCOUNT }} \
            --set-env-vars="PROJECT_ID=${{ vars.PROJECT_ID }},REGION=${{ vars.REGION }},TAG_PARENT=${{ vars.TAG_PARENT }},REGISTRY_BUCKET=${{ vars.REGISTRY_BUCKET }},BIGQUERY_DATASET=${{ vars.BIGQUERY_DATASET }},TASK_QUEUE=${{ vars.TASK_QUEUE }},SERVICE_ACCOUNT_EMAIL=${{ vars.SERVICE_ACCOUNT_EMAIL }},DRY_RUN=${{ vars.DRY_RUN }}"

  # ==========================================
  # JOB 3: DEPLOY TO PROD
  # ==========================================
  deploy-prod:
    name: Build & Deploy (PROD)
    needs: security-checks
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          skip_install: true

      - name: Docker Auth
        run: gcloud auth configure-docker ${{ vars.REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/governance-engine:${{ github.sha }}
            ${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/governance-engine:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # FIX: Natively inject variables into Cloud Run!
      - name: Deploy Cloud Run
        run: |
          gcloud run deploy ${{ vars.CLOUD_RUN_SERVICE }} \
            --project=${{ vars.PROJECT_ID }} \
            --region=${{ vars.REGION }} \
            --image="${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/${{ vars.ARTIFACT_REPOSITORY }}/governance-engine:${{ github.sha }}" \
            --service-account=${{ secrets.WIF_SERVICE_ACCOUNT }} \
            --set-env-vars="PROJECT_ID=${{ vars.PROJECT_ID }},REGION=${{ vars.REGION }},TAG_PARENT=${{ vars.TAG_PARENT }},REGISTRY_BUCKET=${{ vars.REGISTRY_BUCKET }},BIGQUERY_DATASET=${{ vars.BIGQUERY_DATASET }},TASK_QUEUE=${{ vars.TASK_QUEUE }},SERVICE_ACCOUNT_EMAIL=${{ vars.SERVICE_ACCOUNT_EMAIL }},DRY_RUN=${{ vars.DRY_RUN }}"